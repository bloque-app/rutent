name: records

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "m*"

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan check (strict)
        run: cargo run --locked --quiet -p rutent-records --bin plan-check -- --strict
      - name: Tag check (report mode)
        run: cargo run --locked --quiet -p rutent-records --bin tag-check
