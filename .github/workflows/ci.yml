name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "m*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          # A target with no `std`, so the no_std build below proves the contracts need only `core` and `alloc`.
          targets: riscv32imac-unknown-none-elf
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Build the contracts without std (DEC-26)
        # `CMP-STM` runs as a VOS program, which has no `std`; the contracts must build for such a target.
        run: cargo build -p rutent-contracts --no-default-features --target riscv32imac-unknown-none-elf
      - name: Test (includes the boundary check)
        run: cargo test --workspace
      - name: Live resolver test against OpenBao and Vault (T-014-01)
        # The credential proxy's resolvers against real servers (DEC-9, ADR-0004). Each server runs apart, in its
        # own dev-mode container pinned by digest, so neither enters a lockfile or licences/RECORD. The tokens are
        # dev-mode root tokens for these throwaway containers, not secrets. RUTENT_LIVE_REQUIRED makes the test
        # fail, not skip, if a server isn't configured.
        run: |
          docker run -d --name openbao -p 127.0.0.1:8210:8200 -e BAO_DEV_ROOT_TOKEN_ID=ci-dev-token \
            openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
          docker run -d --name vault -p 127.0.0.1:8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=ci-dev-token \
            hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          for port in 8210 8200; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/v1/sys/health" >/dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/v1/sys/health" >/dev/null
          done
          cargo test -p rutent-prov --test proxy live_servers_resolve_and_rotate_a_secret_when_configured -- --exact --nocapture
        env:
          RUTENT_LIVE_REQUIRED: "1"
          RUTENT_LIVE_OPENBAO_ADDR: 127.0.0.1:8210
          RUTENT_LIVE_OPENBAO_TOKEN: ci-dev-token
          RUTENT_LIVE_VAULT_ADDR: 127.0.0.1:8200
          RUTENT_LIVE_VAULT_TOKEN: ci-dev-token
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Documentation check
        # Every crate denies `missing_docs` through `[workspace.lints]`; rustdoc enforces it here.
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # EXP-1's purpose-built store (T-007-02) is behind a feature, off by default, so the steps above don't build
      # it. These build, lint, document and test it with the feature on, real-kill and torn-tail tests included.
      - name: Lint, purpose-built store
        run: cargo clippy --workspace --all-targets --features rutent-stm/purpose-built-store -- -D warnings
      - name: Documentation check, purpose-built store
        run: cargo doc --workspace --no-deps --features rutent-stm/purpose-built-store
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test, purpose-built store
        run: cargo test -p rutent-stm --features rutent-stm/purpose-built-store
