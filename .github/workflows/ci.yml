name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "m*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          # A target with no `std`, so the no_std build below proves the contracts need only `core` and `alloc`.
          targets: riscv32imac-unknown-none-elf,wasm32-unknown-unknown
      # `CMP-PROV`'s module tests build their Rust and C stand-ins (`components/prov/module-guests/build.sh`) and run each
      # in a jailed child of its own (T-013-01). The C ones need a clang that targets wasm32; the Rust ones use the
      # toolchain's own `rust-lld`.
      - name: Toolchain for the module tests' guests
        run: |
          clang=$(command -v clang-18 || command -v clang || true)
          if [[ -z "$clang" ]] || ! "$clang" -print-targets | grep -qw wasm32; then
            sudo apt-get update
            sudo apt-get install -y clang lld
            clang=$(command -v clang)
          fi
          echo "CLANG=$clang" >> "$GITHUB_ENV"
      # A runner setting, not part of the platform: Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, and the platform starts every child in user namespaces of its own (`unshare --user`). `F-030`
      # and `F-033` carry the operator's obligation.
      - name: Allow unprivileged user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Build the contracts without std (DEC-26)
        # `CMP-STM` runs as a VOS program, which has no `std`; the contracts must build for such a target.
        run: cargo build -p rutent-contracts --no-default-features --target riscv32imac-unknown-none-elf
      - name: Test (includes the boundary check)
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Documentation check
        # Every crate denies `missing_docs` through `[workspace.lints]`; rustdoc enforces it here.
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # EXP-1's purpose-built store (T-007-02) is behind a feature, off by default, so the steps above don't build
      # it. These build, lint, document and test it with the feature on, real-kill and torn-tail tests included.
      - name: Lint, purpose-built store
        run: cargo clippy --workspace --all-targets --features rutent-stm/purpose-built-store -- -D warnings
      - name: Documentation check, purpose-built store
        run: cargo doc --workspace --no-deps --features rutent-stm/purpose-built-store
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test, purpose-built store
        run: cargo test -p rutent-stm --features rutent-stm/purpose-built-store
