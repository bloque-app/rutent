name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "m*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          # A target with no `std`, so the no_std build below proves the contracts need only `core` and `alloc`.
          targets: riscv32imac-unknown-none-elf,wasm32-unknown-unknown
      # `CMP-PROV`'s module tests build their Rust and C stand-ins (`components/prov/module-guests/build.sh`) and run each
      # in a jailed child of its own (T-013-01). The C ones need a clang that targets wasm32; the Rust ones use the
      # toolchain's own `rust-lld`.
      - name: Toolchain for the module tests' guests
        run: |
          clang=$(command -v clang-18 || command -v clang || true)
          if [[ -z "$clang" ]] || ! "$clang" -print-targets | grep -qw wasm32; then
            sudo apt-get update
            sudo apt-get install -y clang
            clang=$(command -v clang)
          fi
          echo "CLANG=$clang" >> "$GITHUB_ENV"
      # A runner setting, not part of the platform: Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, and the platform starts every child in user namespaces of its own (`unshare --user`). `F-030`
      # and `F-033` carry the operator's obligation.
      - name: Allow unprivileged user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: cargo build --workspace --all-targets --features rutent-conformance/signing
      - name: Build the contracts without std (DEC-26)
        # `CMP-STM` runs as a VOS program, which has no `std`; the contracts must build for such a target.
        run: cargo build -p rutent-contracts --no-default-features --target riscv32imac-unknown-none-elf
      - name: Test (includes the boundary check)
        run: cargo test --workspace
      - name: Live resolver test against OpenBao and Vault (T-014-01)
        # The credential proxy's resolvers against real servers (DEC-9, ADR-0004). Each server runs apart, in its
        # own dev-mode container pinned by digest, so neither enters a lockfile or licences/RECORD. The tokens are
        # dev-mode root tokens for these throwaway containers, not secrets. RUTENT_LIVE_REQUIRED makes the test
        # fail, not skip, if a server isn't configured.
        run: |
          docker run -d --name openbao -p 127.0.0.1:8210:8200 -e BAO_DEV_ROOT_TOKEN_ID=ci-dev-token \
            openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
          docker run -d --name vault -p 127.0.0.1:8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=ci-dev-token \
            hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          for port in 8210 8200; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/v1/sys/health" >/dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/v1/sys/health" >/dev/null
          done
          cargo test -p rutent-prov --test proxy live_servers_resolve_and_rotate_a_secret_when_configured -- --exact --nocapture
        env:
          RUTENT_LIVE_REQUIRED: "1"
          RUTENT_LIVE_OPENBAO_ADDR: 127.0.0.1:8210
          RUTENT_LIVE_OPENBAO_TOKEN: ci-dev-token
          RUTENT_LIVE_VAULT_ADDR: 127.0.0.1:8200
          RUTENT_LIVE_VAULT_TOKEN: ci-dev-token
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      # The module runtime's guest packages are a workspace of their own (`components/prov/module-guests/`), so the
      # steps above never see them.
      - name: Format, module guests
        run: cargo fmt --manifest-path components/prov/module-guests/Cargo.toml --all -- --check
      - name: Lint, module guests
        run: |
          cargo clippy --manifest-path components/prov/module-guests/Cargo.toml -p rutent-wasm-guests --all-targets -- -D warnings
          cargo clippy --manifest-path components/prov/module-guests/Cargo.toml -p rutent-wasm-standin -p rutent-wasm-role-standin \
            --target wasm32-unknown-unknown --features rutent-wasm-standin/sandboxed,rutent-wasm-standin/reserve,rutent-wasm-role-standin/reserve -- -D warnings
      - name: Documentation check
        # Every crate denies `missing_docs` through `[workspace.lints]`; rustdoc enforces it here.
        run: cargo doc --workspace --no-deps --features rutent-conformance/signing
        env:
          RUSTDOCFLAGS: -D warnings
      # EXP-1's purpose-built store (T-007-02) is behind a feature, off by default, so the steps above don't build
      # it. These build, lint, document and test it with the feature on, real-kill and torn-tail tests included.
      - name: Lint, purpose-built store
        run: cargo clippy --workspace --all-targets --features rutent-stm/purpose-built-store -- -D warnings
      - name: Documentation check, purpose-built store
        run: cargo doc --workspace --no-deps --features rutent-stm/purpose-built-store
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test, purpose-built store
        run: cargo test -p rutent-stm --features rutent-stm/purpose-built-store
