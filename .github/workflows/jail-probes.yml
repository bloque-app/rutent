name: Jail probes

# T-025-02 (DEC-27, THR-85, GUA-5): each layer of the provider's jail probed alone on Linux, and the release build of the
# provider binary scanned for a way to turn a layer off. EXP-2's G-05 assertions (RLIMIT_AS) run here too, which
# T-013-02's notes left to CI. The probes are `components/prov/tests/jail_layers.rs`. The run id, which F-025's notes
# cite, is the run's own (`github.run_id`), printed on every probe's line and in the step summary.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "m*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  jail-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - name: The runner
        run: |
          {
            echo "run id: ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, commit ${GITHUB_SHA}"
            echo "kernel: $(uname -a)"
            echo "LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
            unshare --version
            sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: no"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # A runner setting, not part of the platform: Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, and every jail starts in user namespaces of its own (`unshare --user`).
      - name: Allow unprivileged user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The release build the scan reads: no `jail-layers` feature on its command line.
      - name: Release build of the provider binary
        run: cargo build --release --locked -p rutent-prov --bin rutent-wasm-provider
      # `required-features` hides the probes from `ci.yml`'s workspace clippy, so this job lints them.
      - name: Clippy, with the probes
        run: |
          rustup component add clippy
          cargo clippy --locked -p rutent-prov --all-targets --features jail-layers -- -D warnings
      - name: Probe each layer alone, and scan the release build
        shell: bash
        env:
          RUTENT_RELEASE_PROVIDER: ${{ github.workspace }}/target/release/rutent-wasm-provider
        run: |
          set -o pipefail
          cargo test --locked -p rutent-prov --features jail-layers --test jail_layers -- --test-threads=1 --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/jail-probes.txt"
      - name: The probes' results, with the run id
        if: always()
        shell: bash
        run: |
          {
            echo "### Jail probes, run ${GITHUB_RUN_ID}"
            echo '```'
            grep -E '^jail-probe run|^test ' "$RUNNER_TEMP/jail-probes.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
