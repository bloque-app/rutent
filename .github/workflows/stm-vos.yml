name: STM on VOS

# T-010-05: CMP-STM as a VOS program, tested on real VOS nodes, one and three, with the JIT (the host-contract suite
# and the leader killed mid-submit). The nodes run on the runner host, never in a container or a Docker step, whose
# default seccomp profile blocks userfaultfd. Every binary is built on the runner that runs it, with no cache.
# It never runs on a pull request. A push starts it on this task's branch, a milestone branch or develop, when the
# program, the contracts or the suite it runs change.
# T-010-08 adds, as steps of the vos job: the production-host check (G-37, host-check.sh) on the runner, its tests, a
# node built without native codegen with the host-contract suite run on it, and the recovery drill (a test of
# vos_node.rs, so the full-suite step runs it). The default build and `cargo test --workspace` never need VOS;
# this workflow is the only place the package under components/stm/vos-program is built and run. A change to this file is a DEC-20 path.
# T-010-06 adds a step that damages the frame holding the last acknowledged append, on one node and on the leader of
# three, and records what VOS did (G-54). It records and need not pass, so the step continues on error.
# GitHub runs a workflow_dispatch only for a workflow file on the default branch, so until this file reaches main
# the run is the push of this task's branch; the run id goes in F-010's notes.
on:
  push:
    branches:
      - "f-010/t-010-05-vos-program"
      - "f-010/t-010-06-g54-damaged-frame"
      - "f-010/t-010-08-production-host-check"
      - "m*"
      - "develop"
    paths:
      - "components/stm/**"
      - "contracts/**"
      - "conformance/**"
      - ".github/workflows/stm-vos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_TOOLCHAIN: nightly-2025-07-14
  GUEST_TOOLCHAIN: nightly-2026-03-20
  PROGRAM: components/stm/vos-program

jobs:
  # The list of sources and the revisions the manifests and lockfiles pin agree, with no network and no VOS.
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The pins agree with the list of sources
        run: $PROGRAM/sources.sh check
      - name: The no_std copy of the suite's probe equals the original plus its patch
        run: $PROGRAM/nostd.sh check

  vos:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Directories
        run: |
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "BUILD=$RUNNER_TEMP/b" >> "$GITHUB_ENV"
          echo "VOS_DIR=$RUNNER_TEMP/vos" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: The runner
        run: |
          {
            echo "run id: $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT"
            echo "commit: $GITHUB_SHA"
            echo "runner image: $ImageOS $ImageVersion"
            echo "kernel: $(uname -r)"
            echo "uname: $(uname -sm)"
            grep -m1 'model name' /proc/cpuinfo
            echo "vCPUs: $(nproc)"
            grep MemTotal /proc/meminfo
            sysctl vm.unprivileged_userfaultfd 2>/dev/null || echo "vm.unprivileged_userfaultfd: not present"
          } | tee "$OUT/runner.txt"

      - name: Toolchains
        run: |
          rustup toolchain install "$NODE_TOOLCHAIN" --profile minimal --component rust-src --target wasm32-unknown-unknown
          rustup toolchain install "$GUEST_TOOLCHAIN" --profile minimal --component rust-src
          {
            rustup run "$NODE_TOOLCHAIN" rustc --version
            rustup run "$GUEST_TOOLCHAIN" rustc --version
          } | tee "$OUT/toolchains.txt"

      - name: VOS at its pinned commit
        run: $PROGRAM/fetch-vos.sh "$VOS_DIR"

      - name: Build on this runner
        run: $PROGRAM/build.sh "$BUILD"

      - name: The client's retry tests, which need no node
        run: |
          set -o pipefail
          $PROGRAM/test.sh "$BUILD" --test retry 2>&1 | tee "$OUT/retry-tests.txt"

      - name: The suite on one node and on three, and the leader killed mid-submit
        run: |
          set -o pipefail
          RUN_ID="T-010-05-$GITHUB_RUN_ID" $PROGRAM/test.sh "$BUILD" --test vos_node 2>&1 | tee "$OUT/vos-tests.txt"

      - name: The production-host check passes on this runner, and fails on its fixture
        run: |
          set -o pipefail
          {
            VOS_DIR="$VOS_DIR" $PROGRAM/host-check.sh "$BUILD"
            # The fixture: the same script on a host that lacks userfaultfd write-protect must fail.
            if HOST_CHECK_UFFD=false VOS_DIR="$VOS_DIR" $PROGRAM/host-check.sh "$BUILD"; then
              echo "host-check passed on its fixture, a host without userfaultfd write-protect" >&2
              exit 1
            fi
            echo "host-check failed on its fixture, as it must"
          } 2>&1 | tee "$OUT/host-check.txt"

      - name: The host check's own tests
        run: |
          set -o pipefail
          $PROGRAM/test.sh "$BUILD" --test host_check 2>&1 | tee "$OUT/host-check-tests.txt"

      - name: The node without native codegen, and the suite on it
        run: |
          set -o pipefail
          PORTABLE=1 STEP=node $PROGRAM/build.sh "$BUILD-portable"
          mkdir -p "$BUILD-portable/elf"
          cp "$BUILD"/elf/*.elf "$BUILD-portable/elf/"
          ln -s "$BUILD/client-target" "$BUILD-portable/client-target"
          cp "$BUILD-portable/node-build.log" "$OUT/node-build-portable.log" || true
          RUN_ID="T-010-08-$GITHUB_RUN_ID" $PROGRAM/test.sh "$BUILD-portable" --test vos_node the_host_contract_suite 2>&1 | tee "$OUT/vos-tests-portable.txt"

      - name: G-54, a damaged last acknowledged append on one node and on the leader of three; its result is recorded and need not pass
        continue-on-error: true
        run: |
          set -o pipefail
          G54_OUT="$OUT/g54.txt" RUST_TEST_NOCAPTURE=1 $PROGRAM/test.sh "$BUILD" --test damaged_frame 2>&1 | tee "$OUT/g54-tests.txt"

      - name: Upload the notes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stm-vos-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/*.txt
            ${{ runner.temp }}/b/build-times.txt
            ${{ runner.temp }}/b/digests.txt
            ${{ runner.temp }}/b-portable/build-times.txt
          if-no-files-found: error
