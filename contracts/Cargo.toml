[package]
name = "rutent-contracts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# On by default, so every consumer builds unchanged. Turn it off (`default-features = false`) for a `no_std` target
# with an allocator: the crate then needs only `core` and `alloc` (DEC-26, REQ-OPS-3).
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
