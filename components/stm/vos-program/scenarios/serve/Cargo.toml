# The VOS host server (T-024-02): one host of the host contract, `Stm` on a cluster of VOS nodes, served over the wire
# (../wire) for a caller that can't link VOS, rutent-scenarios-vos. A member of the client's workspace (../../client).
#
# LICENCE. It links the client and through it `vos-node` and `vos-wire`, so it is AGPL-3.0-or-later like the client
# (vos-licence-v0). It is a server alone: nothing links it, and rutent-scenarios-vos runs it as a process of its own.
# Without the `vos` feature, off by default, it builds nothing.
[package]
name = "rutent-stm-vos-serve"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
workspace = "../../client"

[features]
# The server, which links VOS through the client.
vos = ["dep:rutent-stm", "dep:rutent-stm-vos", "rutent-stm-vos/vos"]

[[bin]]
name = "rutent-stm-vos-serve"
required-features = ["vos"]

[dependencies]
rutent-contracts = { path = "../../../../../contracts" }
rutent-stm = { path = "../../..", optional = true }
rutent-stm-vos = { path = "../../client", optional = true }
rutent-stm-vos-wire = { path = "../wire" }
serde_json = "1"
