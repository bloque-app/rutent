# A separate file of the no_std port (SEPARATE): the manifest of the generated copy of conformance's probe,
# which nostd.sh writes from conformance/src/host/probe.rs and probe-nostd.patch. It depends on the real
# contracts crate, built without its default `std` feature.
[package]
name = "rutent-probe-nostd"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
test = false
doctest = false
bench = false

[dependencies]
rutent-contracts = { path = "../../../../contracts", default-features = false }

[lints.rust]
unused_imports = "allow"
