# The plain wallet (`T-016-02`, `F-016`): the default holding account of a public node (`REQ-CAT-23`), a module outside
# the core. One crate, two parts chosen by a feature, `sandboxed` (the wallet's record) and `outside` (nothing to do:
# a plain wallet has no outside interaction). It is a workspace of its own with its own `Cargo.lock`, outside the
# root workspace, as `module-guests/` is: what it brings builds for `wasm32-unknown-unknown` and is never linked
# into the platform. `build.sh` builds it; the guests' tool in `../../module-guests/` componentizes it.
[package]
name = "rutent-plain-wallet"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
sandboxed = []
outside = []

[dependencies]
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc", "std"] }
serde_json = "1.0.154"
rutent-contracts = { path = "../../../../contracts" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
