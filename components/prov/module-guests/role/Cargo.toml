# The role stand-ins as guests (`T-013-01`, `B-01`): the sandboxed part of a module whose code is `M1`'s stand-in of
# one provider category (`rutent-conformance`'s `role::stand_in`), so the role suite can run through the platform.
# `build.sh` builds each of the four for `wasm32-unknown-unknown`.
[package]
name = "rutent-wasm-role-standin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
reserve = []
exchange = []
ramp = []
verifier = []

[dependencies]
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc", "std"] }
serde_json = "1.0.154"
rutent-contracts = { path = "../../../../contracts" }
rutent-conformance = { path = "../../../../conformance" }
