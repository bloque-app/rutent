# The Rust stand-ins of the module runtime (`T-008-02`, moved by `T-013-01`). One crate builds every stand-in: a part
# (`sandboxed` or `outside`) and a provider category (`reserve`, `exchange`, `ramp` or `verifier`) are chosen by
# features, and `build.sh` builds each of the eight combinations for `wasm32-unknown-unknown`.
[package]
name = "rutent-wasm-standin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
sandboxed = []
outside = []
reserve = []
exchange = []
ramp = []
verifier = []

[dependencies]
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc", "std"] }
serde_json = "1.0.154"
