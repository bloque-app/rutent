[package]
name = "rutent-prov"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rutent-wasm-compiler"
path = "src/module/bin/compiler.rs"

[[bin]]
name = "rutent-wasm-provider"
path = "src/module/bin/provider.rs"

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false }
rutent-contracts = { path = "../../contracts" }
# Wasmtime, the LTS release (`DEC-27`): the compiler and the runtime, components, no WASI, no cache, no threads.
wasmtime = { version = "=48.0.8", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "anyhow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
libc = "0.2"
# The credential proxy's HTTPS transport (`T-014-02`): rustls, pure Rust, over ring's primitives; no OpenSSL, no
# aws-lc, no built-in root store (the deployment names the store's CA).
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }

[dev-dependencies]
rutent-conformance = { path = "../../conformance" }
serde_json = "1.0.154"
jsonschema = { version = "0.60.2", default-features = false }
ed25519-dalek = "2.2.0"
