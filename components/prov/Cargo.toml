[package]
name = "rutent-prov"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rutent-wasm-compiler"
path = "src/module/bin/compiler.rs"

[[bin]]
name = "rutent-wasm-provider"
path = "src/module/bin/provider.rs"

[[bin]]
name = "rutent-jail-probe"
path = "src/module/bin/jail_probe.rs"
required-features = ["jail-layers"]

# The jail's layer probes, which need the `jail-layers` feature: `cargo test -p rutent-prov --features jail-layers
# --test jail_layers`, run by `.github/workflows/jail-probes.yml`. `cargo test --workspace` skips them.
[[test]]
name = "jail_layers"
path = "tests/jail_layers.rs"
required-features = ["jail-layers"]

[features]
# Test-only (`T-025-02`): the builder that composes the jail's layers one at a time. Never a default, and enabled by
# nothing but the command line of the job that runs the probes (no feature, no dependent crate and no dev-dependency
# names it: `tools/boundary-check` refuses a package that depends on itself), so a release build has none of it.
jail-layers = []

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false }
rutent-contracts = { path = "../../contracts" }
# Wasmtime, the LTS release (`DEC-27`): the compiler and the runtime, components, no WASI, no cache, no threads.
wasmtime = { version = "=48.0.9", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "anyhow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
libc = "0.2"
# The credential proxy's HTTPS transport (`T-014-02`): rustls, pure Rust, over ring's primitives; no OpenSSL, no
# aws-lc, no built-in root store (the deployment names the store's CA).
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
# Checks a module's output against the provider-role contract's schemas, patterns and lengths included (`B-19`).
jsonschema = { version = "0.60.2", default-features = false }

[dev-dependencies]
rutent-conformance = { path = "../../conformance", features = ["signing"] }
serde_json = "1.0.154"
ed25519-dalek = "2.2.0"
# Test-only, for reading the machine code's header (`T-025-01`): the engine's target and the CPU flags it was made
# under, which Wasmtime writes into every artefact and gives no accessor for. Cranelift's is the runtime's own,
# pinned to its version, for the baseline a triple stands for. Its `x86` and `arm64` features put both backends into
# test builds, so that the x86-64 code is made on an arm64 machine too; the shipped crates don't carry them.
cranelift-codegen = { version = "=0.135.9", default-features = false, features = ["x86", "arm64"] }
object = { version = "=0.39.1", default-features = false, features = ["read_core", "elf"] }
target-lexicon = { version = "=0.13.5", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
# Test-only certificates for the egress connector's TLS tests (`T-014-05`): a CA and leaves for a right name and a
# wrong one, generated in the test. ring, not aws-lc.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
