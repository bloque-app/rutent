[package]
name = "rutent-core-orch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets the test kit make a `stuck::Stated` of its own; never enabled by a build of the assembly.
test-support = []

[dependencies]
rutent-contracts = { path = "../../contracts" }
rutent-router = { path = "../router" }
rutent-stm = { path = "../stm" }
rutent-prov = { path = "../prov" }
rutent-evidence = { path = "../evidence" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Core's adapter for each public network's reader service (`T-020-60`, `DEC-28`): its mTLS client, on rustls over
# ring's primitives, the lines the reader host and the provider system lock; no aws-lc, no OpenSSL, no built-in root
# store (the operator's CA is the one anchor).
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
ed25519-dalek = "2.2.0"
jsonschema = { version = "0.60.2", default-features = false }
proptest = "1.12.0"
