<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The rutent demo network, as one directed graph</title>
<desc>Eight networks are vertices: outer networks (bank rails, external chains), private nodes (one publisher's ledger) and public nodes. Each provider tuple is a labelled directed edge: reserves have a withdrawal and a deposit edge, ramps one edge, the exchange a self-loop on sim-join-ledger converting COP to USD. The operator's wallet holds the public node sim-chain-b.</desc>
