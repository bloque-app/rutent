<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The rutent demo network, as one directed graph</title>
<desc>Ten nodes are vertices: outer networks (banks, chain addresses), private nodes (three publishers' ledgers) and public nodes (two chains). Each provider tuple is a labelled directed edge: 23 in all. Reserves have a withdrawal and a deposit edge; ramps and bridges one edge; exchanges are self-loops. The operator's wallet holds sim-polygon.</desc>
