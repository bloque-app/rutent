<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The paths the demo's orders take through the network</title>
<desc>Each lane is one order's path through the network graph. Acts 1 and 2: sim-join-in-bank to sim-join-ledger by sim-join-in's withdrawal, converted COP to USD by sim-join-exchange inside the ledger, to sim-join-chain by sim-join-ramp-quick, to sim-join-out-bank by sim-join-out's deposit. Act 3: sim-chain-a to sim-chain-ledger by sim-chain-in, to sim-chain-b by sim-chain-ramp-b, where the operator's wallet holds the value, then to sim-chain-e by sim-chain-out-b's deposit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="530" fill="#FFFFFF"/>
<g fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"><rect x="20" y="20" width="640" height="210" rx="12"/><rect x="20" y="260" width="640" height="210" rx="12"/></g>
<g font-size="12" fill="#5F5E5A"><text x="36" y="42">Acts 1 and 2: an order's path, COP to USD</text><text x="36" y="282">Act 3: an order's path, USDC</text></g>
<g stroke="#5F5E5A" stroke-width="1.25" fill="none" marker-end="url(#a)">
<path d="M222 138 C 196 78, 284 78, 258 138"/>
<line x1="108" y1="160" x2="210" y2="160"/><line x1="268" y1="160" x2="390" y2="160"/><line x1="448" y1="160" x2="570" y2="160"/>
<line x1="108" y1="400" x2="210" y2="400"/><line x1="268" y1="400" x2="390" y2="400"/><line x1="448" y1="400" x2="570" y2="400"/>
</g>
<g font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">
<text x="240" y="62">sim-join-exchange</text>
<text x="160" y="148">sim-join-in</text><text x="329" y="148">sim-join-ramp-quick</text><text x="509" y="148">sim-join-out</text>
<text x="160" y="388">sim-chain-in</text><text x="329" y="388">sim-chain-ramp-b</text><text x="509" y="388">sim-chain-out-b</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="240" y="78">COP → USD</text>
<text x="160" y="178">withdrawal · COP</text><text x="329" y="178">USD</text><text x="509" y="178">deposit · USD</text>
<text x="160" y="418">withdrawal · USDC</text><text x="329" y="418">USDC</text><text x="509" y="418">deposit · USDC</text>
<text x="80" y="208">sim-join-in-bank</text><text x="240" y="208">sim-join-ledger</text><text x="420" y="208">sim-join-chain</text><text x="600" y="208">sim-join-out-bank</text>
<text x="80" y="448">sim-chain-a</text><text x="240" y="448">sim-chain-ledger</text><text x="420" y="448">sim-chain-b</text><text x="600" y="448">sim-chain-e</text>
</g>
<g stroke-width="0.75">
<circle cx="80" cy="160" r="28" fill="#F1EFE8" stroke="#5F5E5A"/><circle cx="600" cy="160" r="28" fill="#F1EFE8" stroke="#5F5E5A"/>
<circle cx="80" cy="400" r="28" fill="#F1EFE8" stroke="#5F5E5A"/><circle cx="600" cy="400" r="28" fill="#F1EFE8" stroke="#5F5E5A"/>
<circle cx="240" cy="160" r="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="240" cy="400" r="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.25" stroke-dasharray="4 3"/>
<circle cx="420" cy="160" r="28" fill="#E1F5EE" stroke="#0F6E56"/><circle cx="420" cy="400" r="28" fill="#E1F5EE" stroke="#0F6E56"/>
</g>
<g font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="80" y="160" fill="#444441">outer</text><text x="600" y="160" fill="#444441">outer</text><text x="80" y="400" fill="#444441">outer</text><text x="600" y="400" fill="#444441">outer</text>
<text x="240" y="160" fill="#3C3489">private</text><text x="240" y="400" fill="#3C3489">private</text>
<text x="420" y="160" fill="#085041">public</text><text x="420" y="400" fill="#085041">public</text>
</g>
<rect x="345" y="298" width="150" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="420" y="316" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">operator-wallet</text>
<line x1="420" y1="336" x2="420" y2="370" stroke="#888780" stroke-width="0.75" stroke-dasharray="3 3"/>
<g font-size="12" fill="#444441">
<circle cx="44" cy="504" r="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="58" y="508">outer node</text>
<circle cx="164" cy="504" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 2"/><text x="178" y="508">private node</text>
<circle cx="294" cy="504" r="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="308" y="508">public node</text>
<line x1="410" y1="504" x2="450" y2="504" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#a)"/><text x="460" y="508">a step of the order</text>
</g>
</svg>
