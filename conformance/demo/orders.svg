<svg xmlns="http://www.w3.org/2000/svg" width="780" height="760" viewBox="0 0 780 760" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The paths the demo's orders take through the network</title>
<desc>Each lane is one order's path through the network graph: act 1 from COP at sim-co-bank through sim-andina's ledger, sim-base and sim-liberty's ledger to USD at sim-us-bank; act 2 from sim-polygon addresses across a bridge to sim-base addresses, the fastest objective choosing sim-bridge-fast and the cheapest sim-bridge; act 3 from MXN at sim-mx-bank through sim-azteca's ledger, sim-base and back to sim-polygon, where the order is stuck and handed on to its address.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#888780"/></marker></defs>
<rect width="780" height="760" fill="#FFFFFF"/>
<rect x="12" y="20" width="756" height="214" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="28" y="42" font-size="12" fill="#5F5E5A">Act 1: COP at sim-co-bank to USD at sim-us-bank (sim-andina-exchange fails once, then the route is recalculated)</text>
<line x1="106" y1="155" x2="207" y2="155" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="158" y="145" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-andina-cop</text>
<text x="158" y="173" font-size="10" fill="#5F5E5A" text-anchor="middle">withdrawal · COP</text>
<line x1="261" y1="155" x2="362" y2="155" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="312" y="145" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-andina-base</text>
<text x="312" y="173" font-size="10" fill="#5F5E5A" text-anchor="middle">USDC</text>
<line x1="416" y1="155" x2="517" y2="155" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="468" y="145" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-liberty-in-base</text>
<text x="468" y="173" font-size="10" fill="#5F5E5A" text-anchor="middle">USDC</text>
<line x1="571" y1="155" x2="672" y2="155" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="622" y="145" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-liberty-usd</text>
<text x="622" y="173" font-size="10" fill="#5F5E5A" text-anchor="middle">deposit · USD</text>
<path d="M221 135 C195 75, 275 75, 249 135" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="235" y="65" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-andina-exchange</text>
<text x="235" y="78" font-size="10" fill="#5F5E5A" text-anchor="middle">COP → USDC</text>
<path d="M531 135 C505 75, 585 75, 559 135" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="545" y="65" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-liberty-fx-in</text>
<text x="545" y="78" font-size="10" fill="#5F5E5A" text-anchor="middle">USDC → USD</text>
<circle cx="80" cy="155" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="80" y="159" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="80" y="213" font-size="11" fill="#444441" text-anchor="middle">sim-co-bank</text>
<circle cx="235" cy="155" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="235" y="159" font-size="10" fill="#3C3489" text-anchor="middle">private</text>
<text x="235" y="213" font-size="11" fill="#444441" text-anchor="middle">sim-andina-ledger</text>
<circle cx="390" cy="155" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390" y="159" font-size="10" fill="#085041" text-anchor="middle">public</text>
<text x="390" y="213" font-size="11" fill="#444441" text-anchor="middle">sim-base</text>
<circle cx="545" cy="155" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="545" y="159" font-size="10" fill="#3C3489" text-anchor="middle">private</text>
<text x="545" y="213" font-size="11" fill="#444441" text-anchor="middle">sim-liberty-ledger</text>
<circle cx="700" cy="155" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="700" y="159" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="700" y="213" font-size="11" fill="#444441" text-anchor="middle">sim-us-bank</text>
<rect x="12" y="250" width="756" height="214" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="28" y="272" font-size="12" fill="#5F5E5A">Act 2: USDC on sim-polygon to an address on sim-base, quoted for each objective</text>
<line x1="106" y1="385" x2="259" y2="385" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="183" y="375" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-polygon-wallets</text>
<text x="183" y="403" font-size="10" fill="#5F5E5A" text-anchor="middle">withdrawal · USDC</text>
<line x1="313" y1="385" x2="465" y2="385" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="390" y="375" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-bridge-fast</text>
<text x="390" y="403" font-size="10" fill="#5F5E5A" text-anchor="middle">fastest: 3.00 · 20 s</text>
<line x1="519" y1="385" x2="672" y2="385" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="597" y="375" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-base-wallets</text>
<text x="597" y="403" font-size="10" fill="#5F5E5A" text-anchor="middle">deposit · USDC</text>
<path d="M307 399 Q390 465 471 399" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#g)"/>
<text x="390" y="443" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle">sim-bridge</text>
<text x="390" y="456" font-size="10" fill="#888780" text-anchor="middle">cheapest: 0.10 · 15 min</text>
<circle cx="80" cy="385" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="80" y="389" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="80" y="443" font-size="11" fill="#444441" text-anchor="middle">sim-polygon-addresses</text>
<circle cx="287" cy="385" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="287" y="389" font-size="10" fill="#085041" text-anchor="middle">public</text>
<text x="287" y="443" font-size="11" fill="#444441" text-anchor="middle">sim-polygon</text>
<circle cx="493" cy="385" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="493" y="389" font-size="10" fill="#085041" text-anchor="middle">public</text>
<text x="493" y="443" font-size="11" fill="#444441" text-anchor="middle">sim-base</text>
<circle cx="700" cy="385" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="700" y="389" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="700" y="443" font-size="11" fill="#444441" text-anchor="middle">sim-base-addresses</text>
<rect x="12" y="480" width="756" height="214" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="28" y="502" font-size="12" fill="#5F5E5A">Act 3: MXN at sim-mx-bank to USDC at an address on sim-polygon (stuck at sim-polygon, handed on)</text>
<line x1="106" y1="615" x2="207" y2="615" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="158" y="605" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-azteca-mxn-desk</text>
<text x="158" y="633" font-size="10" fill="#5F5E5A" text-anchor="middle">withdrawal · MXN</text>
<line x1="261" y1="615" x2="362" y2="615" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="312" y="605" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-azteca-base</text>
<text x="312" y="633" font-size="10" fill="#5F5E5A" text-anchor="middle">USDC</text>
<line x1="416" y1="615" x2="517" y2="615" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="468" y="605" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-bridge-back</text>
<text x="468" y="633" font-size="10" fill="#5F5E5A" text-anchor="middle">USDC</text>
<line x1="571" y1="615" x2="672" y2="615" stroke="#A32D2D" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#r)"/>
<text x="622" y="605" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-polygon-wallets</text>
<text x="622" y="633" font-size="10" fill="#A32D2D" text-anchor="middle">refused, then handed on</text>
<path d="M221 595 C195 535, 275 535, 249 595" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="235" y="525" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">sim-azteca-exchange</text>
<text x="235" y="538" font-size="10" fill="#5F5E5A" text-anchor="middle">MXN → USDC</text>
<circle cx="80" cy="615" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="80" y="619" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="80" y="673" font-size="11" fill="#444441" text-anchor="middle">sim-mx-bank</text>
<circle cx="235" cy="615" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="235" y="619" font-size="10" fill="#3C3489" text-anchor="middle">private</text>
<text x="235" y="673" font-size="11" fill="#444441" text-anchor="middle">sim-azteca-ledger</text>
<circle cx="390" cy="615" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390" y="619" font-size="10" fill="#085041" text-anchor="middle">public</text>
<text x="390" y="673" font-size="11" fill="#444441" text-anchor="middle">sim-base</text>
<circle cx="545" cy="615" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="545" y="619" font-size="10" fill="#085041" text-anchor="middle">public</text>
<text x="545" y="673" font-size="11" fill="#444441" text-anchor="middle">sim-polygon</text>
<circle cx="700" cy="615" r="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="700" y="619" font-size="10" fill="#444441" text-anchor="middle">outer</text>
<text x="700" y="673" font-size="11" fill="#444441" text-anchor="middle">sim-polygon-addresses</text>
<text x="545" y="687" font-size="10" fill="#5F5E5A" text-anchor="middle">held by operator-wallet</text>
<g font-size="11" fill="#444441"><circle cx="30" cy="738" r="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="44" y="742">outer</text><circle cx="110" cy="738" r="8" fill="#EEEDFE" stroke="#534AB7" stroke-dasharray="3 2"/><text x="124" y="742">private</text><circle cx="200" cy="738" r="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="214" y="742">public</text><line x1="280" y1="738" x2="310" y2="738" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><text x="318" y="742">a step of the order</text><line x1="440" y1="738" x2="470" y2="738" stroke="#888780" stroke-dasharray="4 3" marker-end="url(#g)"/><text x="478" y="742">the other objective's step</text></g>
</svg>
