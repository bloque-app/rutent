[workspace]
resolver = "3"
members = [
    "contracts",
    "conformance",
    "components/router",
    "components/stm",
    "components/prov",
    "components/core-orch",
    "components/core-authz",
    "components/core-audit",
    "components/evidence",
    "tools/boundary-check",
    "tools/records",
]
exclude = ["tools/boundary-check/tests/fixtures/undocumented"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
