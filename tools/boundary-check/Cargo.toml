[package]
name = "rutent-boundary-check"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The manifests read as TOML, as cargo reads them (#353's review, Medium 1): `toml_edit`'s parser alone, at the version
# the root lock already holds for `proc-macro-crate`, so no package is new to the lock or to `licences/RECORD`.
[dependencies]
toml_edit = { version = "=0.25.19", default-features = false, features = ["parse"] }

[dev-dependencies]
serde_json = "1.0.154"
